# Publishes @simhook/sdk and @simhook/mcp to npm when a package tag is pushed:
#   sdk-v0.1.0   publishes packages/sdk at that version
#   mcp-v0.1.0   publishes packages/mcp at that version
# The tag's version must match the package.json version. Publishing uses npm's
# trusted publishing (OIDC): the npm packages must list this repository and
# this workflow file as a trusted publisher, and no token is stored anywhere.
# 0.1.0 of each package was published by hand (trusted publishing needs an existing
# package). On npm, the trusted publisher of each package must name this repository
# and this file and allow the "npm publish" action: the default since 2026-09-03 is
# staging only, which fails a direct publish with "OIDC permission denied".
# To release: bump "version" in package.json and src/version.ts of the package,
# commit, then push the tag.
name: Publish

on:
  push:
    tags:
      - "sdk-v*"
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install -g npm@latest && npm -v
      - name: Which package
        id: which
        run: |
          case "${GITHUB_REF_NAME}" in
            sdk-v*) echo "dir=packages/sdk" >> "$GITHUB_OUTPUT"; echo "name=@simhook/sdk" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT" ;;
            mcp-v*) echo "dir=packages/mcp" >> "$GITHUB_OUTPUT"; echo "name=@simhook/mcp" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#mcp-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
      - name: Tag matches package.json
        run: |
          actual=$(node -p "require('./${{ steps.which.outputs.dir }}/package.json').version")
          test "$actual" = "${{ steps.which.outputs.version }}" || { echo "tag says ${{ steps.which.outputs.version }}, package.json says $actual"; exit 1; }
      - run: pnpm install --frozen-lockfile
      # The name form (@simhook/mcp...) builds the dependencies too; "./dir..." builds only that package.
      - run: pnpm -r --filter "${{ steps.which.outputs.name }}..." build
      - run: pnpm -r --filter "./${{ steps.which.outputs.dir }}" test
      # pnpm, not npm: it rewrites the workspace: version of @simhook/sdk in
      # the MCP package into the real version at publish time.
      - name: Publish
        working-directory: ${{ steps.which.outputs.dir }}
        run: pnpm publish --provenance --access public --no-git-checks
