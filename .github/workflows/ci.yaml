name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: simhook
          POSTGRES_PASSWORD: simhook
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simhook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test ./... -count=1
        env:
          SIMHOOK_TEST_ADMIN_URL: postgres://simhook:simhook@localhost:5432/postgres?sslmode=disable
      # The committed OpenAPI document must be the one the code produces.
      - name: Contract drift
        run: go run ./cmd/simhook openapi | diff - ../packages/contracts/openapi.json

  js:
    name: Web, site, SDK, MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated types must match the committed document.
      - name: Contract drift
        run: pnpm contracts && git diff --exit-code -- packages/contracts
      - run: pnpm -r build
        env:
          NEXT_PUBLIC_API_URL: https://api.simhook.dev
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node --check scripts/android-release.mjs

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The release variant is unsigned here (no keystore in CI); building it still catches shrinker breakage.
      - run: chmod +x gradlew && ./gradlew :app:lintDebug :app:testDebugUnitTest assembleDebug assembleRelease --no-daemon
