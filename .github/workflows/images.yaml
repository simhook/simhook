name: Images

# Images are published for a commit on main only after CI has passed on it,
# so the floating latest tag never points at a build that failed a test, a
# type check, or the contract and brand gates. A release tag is a deliberate
# act on a commit that already passed, and is built as it is.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            dockerfile: api/Dockerfile
          - name: web
            context: .
            dockerfile: web/Dockerfile
          - name: site
            context: .
            dockerfile: site/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed on, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.simhook.dev' }}
            PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.simhook.dev' }}
            PUBLIC_APP_URL=${{ vars.PUBLIC_APP_URL || 'https://app.simhook.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
