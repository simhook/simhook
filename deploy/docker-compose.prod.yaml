# Production stack on one host: Postgres, the API, the dashboard, the site,
# Caddy for TLS and routing, and a nightly database dump.
#
#   cp .env.example .env && cp api.env.example api.env   # then fill both in
#   mkdir -p secrets && cp /path/to/firebase-service-account.json secrets/fcm.json
#   docker compose -f docker-compose.prod.yaml up -d --build
#
# See README.md in this directory for the full runbook.
name: simhook

# Container logs rotate so a chatty week cannot fill the disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: simhook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: simhook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simhook -d simhook"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ${API_IMAGE:-ghcr.io/simhook/api:latest}
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *logging
    env_file: api.env
    environment:
      SIMHOOK_ENV: production
      SIMHOOK_HTTP_ADDR: ":8080"
      SIMHOOK_PUBLIC_URL: https://${API_DOMAIN:?set API_DOMAIN in .env}
      SIMHOOK_WEB_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
      SIMHOOK_SITE_URL: https://${ROOT_DOMAIN}
      SIMHOOK_COOKIE_DOMAIN: ${ROOT_DOMAIN}
      SIMHOOK_DATABASE_URL: postgres://simhook:${POSTGRES_PASSWORD}@postgres:5432/simhook?sslmode=disable
      SIMHOOK_FCM_CREDENTIALS_FILE: /secrets/fcm.json
      SIMHOOK_TRUST_PROXY: "true"
    volumes:
      - ./secrets/fcm.json:/secrets/fcm.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/simhook/web:latest}
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    <<: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  # The site on the bare domain: static files served by a small Caddy.
  site:
    image: ${SITE_IMAGE:-ghcr.io/simhook/site:latest}
    build:
      context: ..
      dockerfile: site/Dockerfile
      args:
        PUBLIC_API_URL: https://${API_DOMAIN}
        PUBLIC_APP_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    <<: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 6

  caddy:
    build: ./caddy
    image: simhook/caddy:local
    restart: unless-stopped
    <<: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
      ANDROID_RELEASES_URL: ${ANDROID_RELEASES_URL:-https://github.com/simhook/simhook}
    volumes:
      # The directory, not the file: git replaces files by inode, and a mounted
      # file would keep showing the old content until the container is recreated.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      site:
        condition: service_healthy

  # Dumps the database once a day at 03:00 UTC into ./backups and prunes old
  # dumps. A dump is written to a temporary name and renamed when complete, so
  # a copy taken mid-write never sees a half file. Copy that directory off the
  # host; a backup on the same disk is not a backup.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "$$(date -u +%F) 03:00:00" +%s 2>/dev/null || date -u -j -f "%Y-%m-%d %H:%M:%S" "$$(date -u +%F) 03:00:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          name="/backups/simhook-$$(date -u +%F-%H%M).dump"
          if pg_dump -h postgres -U simhook -d simhook -Fc -f "$$name.tmp"; then
            mv "$$name.tmp" "$$name" && echo "backup written: $$name"
          else
            rm -f "$$name.tmp"; echo "backup failed"
          fi
          find /backups -name 'simhook-*.dump' -mtime +$$((BACKUP_KEEP_DAYS - 1)) -delete
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
